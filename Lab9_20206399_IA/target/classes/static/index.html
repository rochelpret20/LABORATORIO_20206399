<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Stf-Puzzle Simplified Version</title><link rel="stylesheet" href="style.css"></head><body><main><h1>Stf-Puzzle <span>Simplified Version</span></h1><p>¡Ordena las piezas y completa la imagen!</p><section class="settings"><img id="preview" alt="Imagen seleccionada"><div class="controls"><label>Color del tablero <input id="color" type="color" value="#ffffff"></label><label>Dimensiones <input id="dimensions" placeholder="Ej. 3x3" autocomplete="off" aria-describedby="hint"></label><small id="hint">Escribe un tablero cuadrado entre 3x3 y 8x8.</small><label class="button secondary" for="file">Seleccionar personaje</label><input id="file" type="file" accept=".jpg,.jpeg,image/jpeg" hidden><button id="start" hidden>Iniciar el juego</button></div></section><p id="message" role="status" aria-live="polite"></p><section id="game" hidden><div id="board" aria-label="Tablero del rompecabezas"></div><p>Haz clic en una pieza junto al espacio vacío para moverla.</p></section></main><script src="app.js"></script></body></html>
